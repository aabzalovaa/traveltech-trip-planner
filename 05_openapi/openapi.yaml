openapi: 3.0.3
info:
  title: TravelTech Trip Recovery API
  description: 
    API подсистемы мониторинга рейсов.
  version: 1.0.0

servers:
  - url: https://api.traveltech.example

tags:
  - name: Trips
    description: План поездки и участники (Core Trip Service)
  - name: Alternatives
    description: Альтернативы и перебронирование (Alternatives Service)
  - name: Notifications
    description: Уведомления о сбоях (Notification Service)

# JWT выдает банковская платформа
security:
  - bearerAuth: []

paths:
  /api/trips/{tripId}:
    get:
      tags: [Trips]
      summary: Просмотр плана поездки
      description: 
        Возвращает элементы маршрута, статусы рейсов
        и время последнего обновления.
      operationId: getTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: План поездки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Получение уведомлений
      description: 
        Возвращает непрочитанные уведомления текущего пользователя 
        и помечает их прочитанными.
      operationId: getNotifications
      responses:
        '200':
          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

  /api/trips/{tripId}/alternatives:
    get:
      tags: [Alternatives]
      summary: Получение списка альтернатив
      description: 
        Возвращает актуальные альтернативы для затронутых элементов маршрута. Учитывает пересадки,
        часовые пояса, багаж и визы.
      operationId: getAlternatives
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Альтернативные варианты
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlternativeList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/trips/{tripId}/alternatives/{alternativeId}:
    patch:
      tags: [Alternatives]
      summary: Выбор или отклонение альтернативы
      operationId: decideAlternative
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/AlternativeId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAlternativeRequest'
      responses:
        '200':
          description: Решение принято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlternativeDecisionResult'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'

  /api/trips/{tripId}/members:
    post:
      tags: [Trips]
      summary: Добавление участника в поездку
      description: 
        Добавляет пользователя банковской платформы
        по его идентификатору.
      operationId: addMember
      parameters:
        - $ref: '#/components/parameters/TripId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMemberRequest'
      responses:
        '201':
          description: Участник добавлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Идентификатор поездки
      schema:
        $ref: '#/components/schemas/Id'
    AlternativeId:
      name: alternativeId
      in: path
      required: true
      description: Идентификатор альтернативы
      schema:
        $ref: '#/components/schemas/Id'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникальный ключ запроса. Защищает от двойного бронирования при повторном нажатии.
      schema:
        $ref: '#/components/schemas/Id'

  schemas:
    Id:
      type: string
      format: uuid
      description: Уникальный идентификатор

    TimeZone:
      type: string
      description: Часовой пояс в формате IANA
      example: Europe/Moscow

    Role:
      type: string
      enum: [OWNER, MEMBER]
      description: OWNER (Организатор) меняет бронь, MEMBER (Участник) только смотрит

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
          example: Только Организатор может менять бронь

    Trip:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          example: Семейная поездка в Стамбул
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum: [PLANNED, ACTIVE, COMPLETED, CANCELLED]
        myRole:
          $ref: '#/components/schemas/Role'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ItineraryItem'

    ItineraryItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [FLIGHT, HOTEL, TRANSFER, ACTIVITY, OTHER]
        title:
          type: string
          example: SVO - IST, TK416
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [CONFIRMED, DELAYED, CANCELLED, NEEDS_ATTENTION]
        flight:
          $ref: '#/components/schemas/Flight'

    Flight:
      type: object
      description: Заполняется только для элементов типа FLIGHT
      properties:
        flightNumber:
          type: string
          example: TK416
        departureAirport:
          $ref: '#/components/schemas/Airport'
        arrivalAirport:
          $ref: '#/components/schemas/Airport'
        departureAt:
          type: string
          format: date-time
        arrivalAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [SCHEDULED, DELAYED, CANCELLED, DEPARTED, ARRIVED]
        updatedAt:
          type: string
          format: date-time
          description: Время последнего обновления статуса или расписания
        checkedAt:
          type: string
          format: date-time
          description: Время последней успешной проверки статуса источником. Не заполняется, если мониторинг недоступен
        isStale:
          type: boolean
          description: true, если данные старше настроенного порога актуальности. Не заполняется, если мониторинг недоступен

    Airport:
      type: object
      properties:
        iataCode:
          type: string
          example: SVO
        timeZone:
          $ref: '#/components/schemas/TimeZone'

    Notification:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        tripId:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [FLIGHT_DELAYED, FLIGHT_CANCELLED, TRIP_PLAN_UPDATED]
        message:
          type: string
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'

    Alternative:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        itineraryItemId:
          $ref: '#/components/schemas/Id'
        type:
          type: string
          enum: [FLIGHT, ACTIVITY]
        title:
          type: string
          example: PC396, SVO - IST
        startsAt:
          type: string
          format: date-time
        startTimeZone:
          $ref: '#/components/schemas/TimeZone'
        endsAt:
          type: string
          format: date-time
        endTimeZone:
          $ref: '#/components/schemas/TimeZone'
        priceDifference:
          type: number
          description: Разница в цене с текущим вариантом (может быть отрицательной)
          example: 3500
        currency:
          type: string
          example: RUB
        baggageIncluded:
          type: boolean
        baggageNote:
          type: string
          description: Чем условия багажа отличаются от текущих
        visaCheck:
          type: string
          enum: [OK, REQUIRED, UNKNOWN]
          description: UNKNOWN значит, что визу нужно проверить самостоятельно
        expiresAt:
          type: string
          format: date-time
          description: До какого момента вариант актуален

    AlternativeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Alternative'

    DecideAlternativeRequest:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [SELECT, REJECT]

    AlternativeDecisionResult:
      type: object
      properties:
        alternativeId:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum: [PENDING, CONFIRMED, FAILED, REJECTED]
          description: PENDING значит, что перебронирование ещё идёт

    AddMemberRequest:
      type: object
      required: [bankUserId, role]
      properties:
        bankUserId:
          type: string
          description: Идентификатор пользователя в банковской платформе
        role:
          $ref: '#/components/schemas/Role'

    Member:
      type: object
      properties:
        bankUserId:
          type: string
        role:
          $ref: '#/components/schemas/Role'

  responses:
    Error:
      description: Ошибка. Тип ошибки определяет код статуса, тело описано моделью Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

openapi: 3.0.0
info:
  title: TravelTech API
  description: "API для управления планами путешествий, синхронизации статусов бронирований и обработки изменений в поездке."
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/personalprojects-bed/TravelTechAPI/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://localhost:8080/api/v1/
  description: Development server
security:
- bearerAuth: []
tags:
- name: Trips
  description: План поездки и участники
- name: Notifications
  description: Уведомления о сбоях
paths:
  /api/trips/{tripId}:
    get:
      tags:
      - Trips
      summary: Просмотр плана поездки
      description: "Возвращает маршрут, роль текущего пользователя и статусы сегментов."
      operationId: getTrip
      parameters:
      - name: tripId
        in: path
        description: Идентификатор поездки
        required: true
        schema:
          $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: План поездки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/notifications:
    get:
      tags:
      - Notifications
      summary: Получение уведомлений
      description: Возвращает все непрочитанные уведомления текущего пользователя.
      operationId: getNotifications
      responses:
        "200":
          description: Список уведомлений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/trips/{tripId}/alternatives:
    get:
      tags:
      - Trips
      summary: Получение списка альтернатив
      description: Возвращает до 3 вариантов замены рейса
      operationId: getAlternatives
      parameters:
      - name: tripId
        in: path
        description: Идентификатор поездки
        required: true
        schema:
          $ref: "#/components/schemas/Id"
      responses:
        "200":
          description: Альтернативные варианты
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlternativeList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/trips/{tripId}/plan:
    patch:
      tags:
      - Trips
      summary: "Подтверждение выбора нового рейса, может сделать только организатор."
      operationId: confirmAlternative
      parameters:
      - name: tripId
        in: path
        description: Идентификатор поездки
        required: true
        schema:
          $ref: "#/components/schemas/Id"
      - name: Idempotency-Key
        in: header
        description: Уникальный ключ запроса. Защищает от двойного бронирования при повторном нажатии.
        required: true
        schema:
          $ref: "#/components/schemas/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAlternativeRequest"
        required: true
      responses:
        "200":
          description: Выбор принят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanChangeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/trips/{tripId}/members:
    post:
      tags:
      - Trips
      summary: Добавление участника в поездку
      description: Только Организатор. Приглашает человека по email.
      operationId: addMember
      parameters:
      - name: tripId
        in: path
        description: Идентификатор поездки
        required: true
        schema:
          $ref: "#/components/schemas/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "201":
          description: Приглашение создано
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  schemas:
    Id:
      type: string
      description: Уникальный идентификатор
      format: uuid
    TimeZone:
      type: string
      description: Таймзона места события в формате IANA
      example: Europe/Moscow
    Role:
      type: string
      enum:
      - ORGANIZER
      - PARTICIPANT
    Error:
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: string
          example: SERVICE_UNAVAILABLE
        message:
          type: string
          example: Сервис бронирования временно недоступен
    Trip:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
          example: Семейная поездка в Стамбул
        myRole:
          $ref: "#/components/schemas/Role"
        segments:
          type: array
          items:
            $ref: "#/components/schemas/Segment"
    Segment:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
          - FLIGHT
          - HOTEL
          - TRANSFER
          - ACTIVITY
        title:
          type: string
          example: "SVO - IST, TK416"
        startsAt:
          type: string
          format: date-time
        statusUpdateAt:
          type: string
          format: date-time
        timeZone:
          $ref: "#/components/schemas/TimeZone"
        status:
          type: string
          enum:
          - CONFIRMED
          - DELAYED
          - CANCELLED
          - NEEDS_ATTENTION
    Notification:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        tripId:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
          - FLIGHT_DELAYED
          - FLIGHT_CANCELLED
          - ALTERNATIVES_READY
          - TRIP_PLAN_UPDATED
        message:
          type: string
        createdAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
    Alternative:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        flightNumber:
          type: string
          example: PC396
        departureAt:
          type: string
          format: date-time
        departureTimeZone:
          $ref: "#/components/schemas/TimeZone"
        arrivalAt:
          type: string
          format: date-time
        arrivalTimeZone:
          $ref: "#/components/schemas/TimeZone"
        baggageIncluded:
          type: boolean
        priceDifference:
          type: number
          description: Разница в цене с текущим билетом (может быть отрицательной)
          example: 3500
        currency:
          type: string
          example: RUB
        expiresAt:
          type: string
          description: До какого момента вариант гарантированно актуален
          format: date-time
    AlternativeList:
      type: object
      properties:
        segmentId:
          $ref: "#/components/schemas/Id"
        items:
          maxItems: 3
          type: array
          items:
            $ref: "#/components/schemas/Alternative"
    ConfirmAlternativeRequest:
      required:
      - alternativeId
      type: object
      properties:
        alternativeId:
          $ref: "#/components/schemas/Id"
    PlanChangeResult:
      type: object
      properties:
        tripId:
          $ref: "#/components/schemas/Id"
        status:
          type: string
          description: "PENDING значит, что перебронирование ещё идёт"
          enum:
          - PENDING
          - CONFIRMED
          - FAILED
    AddMemberRequest:
      required:
      - email
      - role
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
    Member:
      type: object
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        status:
          type: string
          enum:
          - INVITED
          - ACTIVE
  responses:
    BadRequest:
      description: "Неверные данные в запросе (например, tripId не является uuid)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Нет токена или он недействителен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: "Недостаточно прав (например, Участник пытается изменить бронь)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Поездка не найдена или пользователь в ней не состоит
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Конфликт состояния (подробности в описании эндпоинта)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: Сервис или внешняя система временно недоступны.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    TripId:
      name: tripId
      in: path
      description: Идентификатор поездки
      required: true
      schema:
        $ref: "#/components/schemas/Id"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
